[pytest]
testpaths = tests
asyncio_mode = auto

# This dev machine has ROS Humble on PYTHONPATH (/opt/ros/humble/...). pytest
# auto-loads its plugins through the 'pytest11' entry point, and launch_testing
# depends on 'lark' — which is not in this venv. Collection then dies before a
# single test runs. Disabling them by name is cheaper and less surprising than
# PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 (which would also disable pytest-asyncio,
# which we need).
addopts =
    -p no:launch_testing
    -p no:launch_ros
    -p no:ament_copyright
    -p no:ament_flake8
    -p no:ament_lint
    -p no:ament_pep257
    -p no:ament_xmllint
