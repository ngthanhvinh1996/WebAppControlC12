[pytest]
testpaths = tests
asyncio_mode = auto

# Máy dev có ROS Humble trên PYTHONPATH (/opt/ros/humble/...). pytest tự nạp plugin
# của nó qua entry point 'pytest11', và launch_testing thì phụ thuộc 'lark' — thứ
# không có trong venv này. Kết quả là collection chết trước khi chạy test nào.
# Tắt đích danh, rẻ hơn và ít bất ngờ hơn PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
# (cờ đó sẽ tắt luôn pytest-asyncio mà ta đang cần).
addopts =
    -p no:launch_testing
    -p no:launch_ros
    -p no:ament_copyright
    -p no:ament_flake8
    -p no:ament_lint
    -p no:ament_pep257
    -p no:ament_xmllint
